name: tmp-base

# 临时: 用"合并前"的 src/tests/依赖 跑同一批失败用例, 判断这些失败是不是本次合并引入的.
on:
  push:
    tags: ["base-*"]

jobs:
  baseline:
    name: baseline (pre-merge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore pre-merge tree
        run: git checkout 60daca0 -- src tests pyproject.toml uv.lock

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-extras --dev

      - name: Run the failing tests on pre-merge code
        run: |
          uv run pytest -q --tb=line -p no:cacheprovider \
            tests/media/test_pipeline.py::test_poster_cropped_when_candidate_small \
            tests/db/test_facets.py \
            tests/api/test_facets_write.py \
            "tests/api/test_feeds.py::TestFeedsCrud::test_feed_item_batch_scrape_uses_feed_config" \
            "tests/api/test_schedules.py::TestSchedules::test_crud_and_trigger" \
            tests/agent/test_feed_ops.py::test_list_and_batch_feed_items \
            tests/agent/test_schedule_ops.py::test_create_update_and_trigger_schedule \
            "tests/db/test_repository.py::TestMetadataRepo::test_delete_blocks_own_names_keeps_shared" \
            || true
