name: retag

# 不构建: 直接把某个已有镜像标签指向另一个标签 (回滚 / 修正 latest).
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source image tag, e.g. 0.19.0-custom.15"
        required: true
      target:
        description: "Target tag to repoint, e.g. latest"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Repoint tag
        run: |
          set -euo pipefail
          IMG="ghcr.io/${{ github.repository_owner }}/amane"
          SRC="${{ inputs.source }}"
          DST="${{ inputs.target }}"
          echo "== before: $IMG:$DST"
          docker buildx imagetools inspect "$IMG:$DST" > before.txt || echo "(tag not found)"
          grep -E 'Digest|MediaType' before.txt || true
          docker buildx imagetools create -t "$IMG:$DST" "$IMG:$SRC"
          echo "== after: $IMG:$DST"
          docker buildx imagetools inspect "$IMG:$DST" > after.txt || true
          grep -E 'Digest|MediaType' after.txt || true
