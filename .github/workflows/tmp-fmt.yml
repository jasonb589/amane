name: tmp-fmt

on:
  push:
    tags: ["fmt-*"]

permissions:
  contents: write

jobs:
  fmt:
    name: ruff format + fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: custom

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: format
        run: |
          uv run ruff check --fix src/amane tests
          uv run ruff format src/amane tests

      - name: commit and push
        run: |
          git config user.name "jasonb589"
          git config user.email "jasonb589@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "already clean"
          else
            git diff --cached --stat
            git commit -m "chore: ruff format"
            git push origin HEAD:custom
          fi
