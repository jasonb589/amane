name: tmp-fmt

# 临时: 只把 ruff format 的结果推回分支, 用完删掉.
on:
  push:
    tags: ["fmt-*"]

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: custom

      - name: Set up UV
        uses: astral-sh/setup-uv@v9.0.0

      - name: Sync
        run: uv sync --frozen --all-extras --dev

      - name: Format
        run: uv run ruff format src/amane tests scripts

      - name: Commit and push
        run: |
          git config user.name "jasonb589"
          git config user.email "31660473+jasonb589@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "style: ruff format" || echo "nothing to format"
          git push origin HEAD:custom
