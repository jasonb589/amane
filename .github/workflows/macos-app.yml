name: macOS app

on:
  push:
    tags:
      - "v*"
      - "!v*-custom.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  macos-app:
    name: Build Amane.app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: just macos-app
        run: just macos-app

      - name: Zip Amane.app
        id: zip
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP="dist/Amane-${TAG}-macos.app.zip"
          ditto -c -k --keepParent dist/Amane.app "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          ls -lh "$ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Amane.app-${{ github.ref_name }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python scripts/changelog.py extract "$GITHUB_REF_NAME" > release-notes.md

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: ${{ steps.zip.outputs.zip }}
          fail_on_unmatched_files: true
