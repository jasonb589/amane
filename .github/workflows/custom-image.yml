name: custom image

# 用途: 在自己 fork 里构建带补丁的镜像, 推到自己的 GHCR.
# 触发: ① 推 v* 标签 (如 v0.19.0-custom.14) —— 一次构建出 :latest / :0.19.0-custom.14 / :custom / :sha-xxxxxxx
#       ② Actions 页面 Run workflow (调试用, 只出 :custom 与 :sha-xxxxxxx, 不覆盖 :latest)
# 只跟 tag: 分支 push 不再重复构建一次, 也避免网页 Sync fork 后用未打补丁的 main 覆盖 :latest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up UV
        uses: astral-sh/setup-uv@v9.0.0

      - name: Python syntax check
        run: uv run --no-project --python 3.14 python -m compileall -q src/amane

      - name: Check custom version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            echo "EXPECTED_VERSION=$V" >> "$GITHUB_ENV"
          else
            V=""
          fi
          COMMITTED="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' src/amane/_custom_version.py | head -1)"
          echo "ref 版本: '${V}'  源码内版本: '${COMMITTED}'"
          if [ -n "$V" ] && [ "$V" != "$COMMITTED" ]; then
            echo "::error::tag 版本 ($V) 与 src/amane/_custom_version.py 里的版本 ($COMMITTED) 不一致: 先改版本文件、提交后再打 tag。"
            exit 1
          fi
          # 兜底: 尽力把版本写进 version.py 的 _BUILD_VERSION (构建缓存偶尔会吃掉, 只当 fallback)。
          {
            python3 - "$COMMITTED" <<'PY'
          import pathlib, re, sys
          v = sys.argv[1]
          if not v:
              raise SystemExit(0)
          p = pathlib.Path("src/amane/version.py")
          s = p.read_text(encoding="utf-8")
          s2 = re.sub(r'(?m)^_BUILD_VERSION = ".*"$', f'_BUILD_VERSION = "{v}"', s, count=1)
          p.write_text(s2, encoding="utf-8")
          print(f"stamped src/amane/version.py: {v}")
          PY
          } || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Web typecheck (informational)
        continue-on-error: true
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b --noEmit

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/amane" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=custom
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Show version info
        run: |
          echo "expected version: ${EXPECTED_VERSION:-<none, 分支/手动触发>}"
          grep -n 'VERSION = ' src/amane/_custom_version.py
          grep -n '_BUILD_VERSION' src/amane/version.py
          git log --oneline -1

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 与上游一致: 同时出 amd64 和 arm64, 任何 NAS 都能用 (arm64 走 QEMU, 慢一些)
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image version label
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          expected = os.environ.get("EXPECTED_VERSION", "")
          if not expected:
              print("非 tag 触发, 跳过版本自检")
              raise SystemExit(0)
          repo = os.environ["GITHUB_REPOSITORY"].lower()
          tok = json.load(urllib.request.urlopen(f"https://ghcr.io/token?service=ghcr.io&scope=repository:{repo}:pull"))["token"]
          def get(url, accept):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}", "Accept": accept})
              return json.load(urllib.request.urlopen(req))
          idx = get(f"https://ghcr.io/v2/{repo}/manifests/{expected}", "application/vnd.oci.image.index.v1+json")
          amd = next(m["digest"] for m in idx["manifests"] if m["platform"]["architecture"] == "amd64")
          man = get(f"https://ghcr.io/v2/{repo}/manifests/{amd}", "application/vnd.oci.image.manifest.v1+json")
          cfg = get(f"https://ghcr.io/v2/{repo}/blobs/{man['config']['digest']}", "application/json")
          label = (cfg["config"].get("Labels") or {}).get("org.opencontainers.image.version", "")
          print("image label version:", label, "expected:", expected)
          raise SystemExit(0 if label == expected else 1)
          PY
