name: custom image

# 用途: 在自己 fork 里构建带补丁的镜像, 推到自己的 GHCR.
# 触发: ① custom 分支 push (给 :custom 与 :sha-xxxxxxx)
#       ② 推 v* 标签, 如 v0.19.0-custom.1 (额外给 :0.19.0-custom.1 这样的版本号)
#       ③ Actions 页面手动 Run workflow
#       只管 custom 分支, 避免在网页 Sync fork 时用未打补丁的 main 覆盖 :custom.
on:
  push:
    branches: ["custom"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up UV
        uses: astral-sh/setup-uv@v9.0.0

      - name: Python syntax check
        run: uv run --no-project --python 3.14 python -m compileall -q src/amane

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/amane" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=custom
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 与上游一致: 同时出 amd64 和 arm64, 任何 NAS 都能用 (arm64 走 QEMU, 慢一些)
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
