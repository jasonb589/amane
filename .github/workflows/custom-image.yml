name: custom image

# 用途: 在自己 fork 里构建带补丁的镜像, 推到自己的 GHCR.
# 触发: ① custom 分支 push (给 :custom 与 :sha-xxxxxxx)
#       ② 推 v* 标签, 如 v0.19.0-custom.1 (额外给 :0.19.0-custom.1 这样的版本号)
#       ③ Actions 页面手动 Run workflow
#       只管 custom 分支, 避免在网页 Sync fork 时用未打补丁的 main 覆盖 :custom.
on:
  push:
    branches: ["custom"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up UV
        uses: astral-sh/setup-uv@v9.0.0

      - name: Python syntax check
        run: uv run --no-project --python 3.14 python -m compileall -q src/amane

      - name: Stamp custom version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            BASE="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
            V="${BASE}-custom.dev.$(git rev-parse --short HEAD)"
          fi
          echo "STAMPED_VERSION=$V" >> "$GITHUB_ENV"
          echo "version stamp = $V"
          python3 - "$V" <<'PY'
          import pathlib
          import re
          import sys
          v = sys.argv[1]
          p = pathlib.Path("src/amane/version.py")
          s = p.read_text(encoding="utf-8")
          s2 = re.sub(r'(?m)^_BUILD_VERSION = ".*"$', f'_BUILD_VERSION = "{v}"', s, count=1)
          assert s2 != s, "version.py 未找到 _BUILD_VERSION 行"
          p.write_text(s2, encoding="utf-8")
          print(f"stamped src/amane/version.py: {v}")
          PY
          # 把 stamp 也落进本地提交: 万一构建上下文取的是提交内容而不是工作区, 版本号同样能带上.
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -q -am "ci: stamp ${V}" || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Web typecheck (informational)
        continue-on-error: true
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b --noEmit

      - name: Image name
        run: echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/amane" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=custom
      - name: Show stamped version
        run: |
          echo "STAMPED_VERSION=${STAMPED_VERSION}"
          grep -n '_BUILD_VERSION' src/amane/version.py
          git log --oneline -1
          git status --short
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            AMANE_VERSION=${{ env.STAMPED_VERSION }}
          # 与上游一致: 同时出 amd64 和 arm64, 任何 NAS 都能用 (arm64 走 QEMU, 慢一些)
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify injected version
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"].lower()
          tag = os.environ.get("STAMPED_VERSION", "")
          tok = json.load(urllib.request.urlopen(f"https://ghcr.io/token?service=ghcr.io&scope=repository:{repo}:pull"))["token"]
          def get(url, accept):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {tok}", "Accept": accept})
              return json.load(urllib.request.urlopen(req))
          idx = get(f"https://ghcr.io/v2/{repo}/manifests/{tag}", "application/vnd.oci.image.index.v1+json")
          amd = next(m["digest"] for m in idx["manifests"] if m["platform"]["architecture"] == "amd64")
          man = get(f"https://ghcr.io/v2/{repo}/manifests/{amd}", "application/vnd.oci.image.manifest.v1+json")
          cfg = get(f"https://ghcr.io/v2/{repo}/blobs/{man['config']['digest']}", "application/json")
          envs = [e for e in cfg["config"].get("Env", []) if e.startswith("AMANE_VERSION=")]
          print("image env:", envs, "expected:", tag)
          sys.exit(0 if f"AMANE_VERSION={tag}" in envs else 1)
          PY
