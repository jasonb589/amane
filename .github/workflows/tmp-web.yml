name: tmp-web

# 临时: 校验前端 (oxlint + oxfmt + tsc + i18n 键) 与构建, 用完删除.
on:
  push:
    tags: ["web-*"]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: web
        run: pnpm check

      - name: Build
        working-directory: web
        run: pnpm build
