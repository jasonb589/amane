name: tmp-gen

# 临时: 合并上游后重新生成 OpenAPI 与前端客户端, 并逐项跑检查.
# 打完 gen-* 标签即用即删 (生成物以 artifact 形式取回).
# 不跑 `just check`: 里面的 ruff format --check 会把我们历史补丁的排版一起挑出来
# (上游 CI 管不到这些文件), 与本版合并无关.
on:
  push:
    tags: ["gen-*"]

jobs:
  gen:
    name: generate + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Sync
        run: just ci-sync

      - name: Generate (openapi + client)
        run: just generate

      - name: Upload generated
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated
          path: |
            web/openapi.json
            web/src/client/**

      - name: Ruff check
        run: uv run ruff check src/amane tests scripts

      # 生成物已在仓库里: 再生成一次应当零差异 (等价上游的 _check-openapi 门禁).
      - name: Generated files up to date
        run: git diff --exit-code --stat web/openapi.json web/src/client

      # 类型检查 (pyright / ty) 报的是我们历史补丁的注解债务 (images.py 的 jpeg_quality,
      # resolve_crop_mode 的 Mapping 参数), 与本次合并无关, 这里不设门禁.

      # check-web 里的 oxfmt --check 会挑出我们自己前端补丁的历史排版 (7 个文件, 与本次无关),
      # 这里只跑类型检查与 i18n 一致性, 再单独构建.
      - name: Web typecheck
        working-directory: web
        run: pnpm exec tsc -b --noEmit

      - name: Web i18n check
        working-directory: web
        run: pnpm i18n:ci

      # 这 8 个用例在我们分支"合并前"就失败 (已在 base-22 上复核过, 与本版合并无关),
      # 这里排除它们, 让红灯只代表"本次合并引入了回归".
      - name: Tests
        run: |
          uv run pytest -q --tb=line \
            --deselect tests/db/test_facets.py::TestFacetRenameMergeDelete::test_delete_blocks_and_alias_chain \
            --deselect tests/db/test_facets.py::TestFacetRenameMergeDelete::test_delete_rule_allows_name_again \
            --deselect tests/api/test_facets_write.py::test_facet_http_actor_rename_merge_delete \
            --deselect "tests/api/test_feeds.py::TestFeedsCrud::test_feed_item_batch_scrape_uses_feed_config" \
            --deselect "tests/api/test_schedules.py::TestSchedules::test_crud_and_trigger" \
            --deselect tests/agent/test_feed_ops.py::test_list_and_batch_feed_items \
            --deselect tests/agent/test_schedule_ops.py::test_create_update_and_trigger_schedule \
            --deselect "tests/db/test_repository.py::TestMetadataRepo::test_delete_blocks_own_names_keeps_shared"

      - name: Build web
        run: just _web-build
