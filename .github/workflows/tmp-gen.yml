name: tmp-gen

# 临时: 合并上游后重新生成 OpenAPI 与前端客户端, 并逐项跑检查.
# 打完 gen-* 标签即用即删 (生成物以 artifact 形式取回).
# 不跑 `just check`: 里面的 ruff format --check 会把我们历史补丁的排版一起挑出来
# (上游 CI 管不到这些文件), 与本版合并无关.
on:
  push:
    tags: ["gen-*"]

jobs:
  gen:
    name: generate + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Sync
        run: just ci-sync

      - name: Generate (openapi + client)
        run: just generate

      - name: Upload generated
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated
          path: |
            web/openapi.json
            web/src/client/**

      - name: Ruff check
        run: uv run ruff check src/amane tests scripts

      # 生成物已在仓库里: 再生成一次应当零差异 (等价上游的 _check-openapi 门禁).
      - name: Generated files up to date
        run: git diff --exit-code --stat web/openapi.json web/src/client

      # 类型检查 (pyright / ty) 报的是我们历史补丁的注解债务 (images.py 的 jpeg_quality,
      # resolve_crop_mode 的 Mapping 参数), 与本次合并无关, 这里不设门禁.

      - name: Web check
        run: just check-web

      - name: Tests
        run: just test-cov

      - name: Build web
        run: just _web-build
