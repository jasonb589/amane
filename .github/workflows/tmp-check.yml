name: tmp-check

# 临时校验（.5 修 amazon/tenhow 抽象类无法实例化）。check-* 标签触发，跑完删除。
on:
  push:
    tags: ["check-*"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Ruff
        run: uv run ruff check src tests --output-format=concise

      - name: Pytest
        run: uv run pytest tests/test_tenhow_source.py tests/test_amazon_source.py tests/utils/test_utils.py -q

      - name: 爬虫完整性（防回归：不抽象 + 已注册 + 在电影源清单里）
        run: |
          uv run python - <<'PY'
          import inspect

          import amane.crawlers.sites as sites_pkg
          from amane.crawlers import registry
          from amane.crawlers.base import Crawler
          from amane.crawlers.site_roles import FILM_METADATA_SITES
          from amane.enums import SiteName

          problems = []
          for name in sites_pkg.__all__:
              cls = getattr(sites_pkg, name)
              site = cls.profile().name
              if inspect.isabstract(cls):
                  missing = sorted(getattr(cls, "__abstractmethods__", ()))
                  problems.append(f"{name}: 抽象方法未实现 {missing}")
              if registry.get(site) is None:
                  problems.append(f"{name}: 未注册")
          assert not problems, problems
          assert issubclass(getattr(sites_pkg, "AmazonCrawler"), Crawler)
          for site in (SiteName.THEPORNDB, SiteName.TENHOW, SiteName.AMAZON, SiteName.DMM):
              assert site in FILM_METADATA_SITES, f"{site} 不在电影源清单"
          print("film sites:", len(FILM_METADATA_SITES))
          print("ok")
          PY

      - name: 路由校验冒烟
        run: |
          uv run python - <<'PY'
          from amane.config.manager import HotSettings

          routes = HotSettings().scraping.content_routes
          assert "western" in routes
          print("content_routes ok:", {str(k): list(v) for k, v in routes.items()})
          PY
