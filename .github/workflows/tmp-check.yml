name: tmp-check

# 临时校验: 仅用于本轮改动验证, 验证通过后删除.
on:
  push:
    tags: ["check-*"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check src/amane tests scripts
          uv run ruff format --check src/amane/crawlers/sites/dmm.py tests/test_dmm_hentai.py

      - name: Tests (dmm)
        run: uv run pytest tests/test_dmm_hentai.py tests/test_dmm_hentai_anime.py tests/test_dmm_hentai_priority.py tests/test_dmm_episode_guard.py -q

      - name: Tests (all)
        run: uv run pytest tests/ -q -p no:randomly
