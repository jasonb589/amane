name: tmp-check

# 临时校验: 仅用于本轮改动验证, 验证通过后删除.
on:
  push:
    tags: ["check-*"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check src/amane tests scripts
          uv run ruff format --check src/amane/parsing/file_info.py tests/parsing/test_file_info.py

      - name: Tests (parsing)
        run: uv run pytest tests/parsing -q

      - name: Tests (all)
        run: uv run pytest tests/ -q -p no:randomly
