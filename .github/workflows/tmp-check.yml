name: tmp-check

# 临时校验: 仅用于本轮改动验证, 验证通过后删除.
on:
  push:
    tags: ["check-*"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check src/amane tests scripts
          uv run ruff format --check src/amane/crawlers/sites/amazon.py src/amane/crawlers/sites/dmm.py \
            src/amane/aggregate/models.py src/amane/aggregate/engine.py \
            tests/test_amazon_source.py tests/test_dmm_hentai_anime.py tests/aggregate/test_engine.py

      - name: Tests (amazon)
        run: uv run pytest tests/test_amazon_source.py -q

      - name: Tests (all)
        run: uv run pytest tests/ -q -p no:randomly
