name: tmp-check

# 临时校验: 只跑 lint + 通知相关用例, 打完 check-* 标签即用即删.
on:
  push:
    tags: ["check-*"]

jobs:
  notify:
    name: notify check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen --all-extras --dev

      - name: Ruff check
        run: uv run ruff check src/amane tests

      - name: Ruff format
        run: uv run ruff format --check src/amane/notify tests/test_notify_card.py

      - name: Pytest
        run: uv run pytest -q tests/test_notify_card.py tests/test_notify_html.py tests/test_notify_service.py tests/test_notify_templates.py
