name: tmp-check

# 临时校验: 仅用于本轮改动验证, 验证通过后删除
on:
  push:
    tags: ["check-*"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check src/amane tests scripts
          uv run ruff format --check src/amane/handlers/protocol.py src/amane/handlers/purge.py \
            src/amane/scheduler/worker.py tests/handlers/test_purge.py tests/scheduler/test_worker.py

      - name: Tests (purge + worker)
        run: uv run pytest tests/handlers/test_purge.py tests/scheduler/test_worker.py -q

      - name: Tests (all)
        run: uv run pytest tests/ -q -p no:randomly
