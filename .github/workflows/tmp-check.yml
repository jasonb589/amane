name: tmp-check

# 临时校验（里番关键词优化）: ruff + 里番相关单测 + 导入冒烟. 校验完删除本文件.
on:
  push:
    tags: ["check-*"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Ruff
        run: |
          uv run ruff check src tests --output-format=concise
          uv run ruff format --check src/amane/crawlers/sites/dmm.py tests/test_dmm_hentai.py

      - name: Pytest (里番相关)
        run: uv run pytest tests/test_dmm_hentai.py -q

      - name: 关键词冒烟（真实案例）
        run: |
          uv run python - <<'PY'
          from amane.crawlers.sites.dmm import DmmCrawler
          kws = DmmCrawler._hentai_keywords(
              "陰湿オタクにイカれる妹3 精液奴隷",
              "/media/gx/里番/陰湿オタクにイカれる妹（彼女）3 精液奴隷.mp4",
          )
          print("keywords:", kws)
          print("ratio:", DmmCrawler._title_ratio("陰湿オタクにイカれる妹3 精液奴隷", "陰湿オタクにイカれる妹（彼女）3 精液奴隷"))
          assert "陰湿オタクにイカれる妹（彼女）3" in kws
          assert DmmCrawler._title_ratio("陰湿オタクにイカれる妹3 精液奴隷", "陰湿オタクにイカれる妹（彼女）3 精液奴隷") >= DmmCrawler._HENTAI_MIN_RATIO
          PY
