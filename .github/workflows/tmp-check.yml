name: tmp-check

on:
  push:
    tags: ["check-*"]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: 只跑格式检查并打印 diff
        run: uv run ruff format --check --diff src/amane/utils/language.py tests/utils/test_utils.py || true
      - name: 顺带看 language.py 前 60 行
        run: sed -n '1,60p' src/amane/utils/language.py
