name: tmp-check

on:
  push:
    tags: ["check-*"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Ruff
        run: uv run ruff check src tests --output-format=concise

      - name: Pytest
        run: uv run pytest tests/test_dmm_hentai.py tests/test_dmm_episode_guard.py -q

      - name: 冒烟（候选上限 / 集数）
        run: |
          uv run python - <<'PY'
          from amane.crawlers.sites.dmm import DmmCrawler, _hentai_digits

          assert DmmCrawler._HENTAI_MAX_TRIES == 8, DmmCrawler._HENTAI_MAX_TRIES
          assert _hentai_digits("＃1") != _hentai_digits("＃4")
          print("max tries:", DmmCrawler._HENTAI_MAX_TRIES, "| keywords cap:", DmmCrawler._HENTAI_MAX_KEYWORDS)
          PY
