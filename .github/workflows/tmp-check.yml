name: tmp-check

on:
  push:
    tags: ["check-*"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Ruff
        run: uv run ruff check src tests --output-format=concise

      - name: Pytest
        run: uv run pytest tests/test_dmm_hentai.py tests/test_dmm_episode_guard.py tests/test_tenhow_source.py tests/test_amazon_source.py -q

      - name: 串集防护冒烟
        run: |
          uv run python - <<'PY'
          from amane.crawlers.sites.dmm import _hentai_digits
          a = _hentai_digits("OVA初恋時間。 ＃1 セル版")
          b = _hentai_digits("OVA初恋時間。 ＃4 セル版")
          assert a != b, (a, b)
          print("digits:", sorted(a), "vs", sorted(b))
          PY

      - name: 爬虫完整性
        run: |
          uv run python - <<'PY'
          import inspect

          import amane.crawlers.sites as sites_pkg
          from amane.crawlers import registry

          problems = []
          for name in sites_pkg.__all__:
              cls = getattr(sites_pkg, name)
              if inspect.isabstract(cls):
                  problems.append(f"{name}: abstract")
              if registry.get(cls.profile().name) is None:
                  problems.append(f"{name}: not registered")
          assert not problems, problems
          print("ok")
          PY
