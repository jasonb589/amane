name: tmp-check

# 临时校验工作流: 推 check-* 标签即跑 static + test, 用完删除 (含远端标签).
on:
  push:
    tags: ["check-*"]

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  static:
    name: just ci-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: just ci-static
        run: just ci-static

  test:
    name: just ci-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: just ci-test
        env:
          FIXTURES_DEPLOY_KEY: ${{ secrets.FIXTURES_DEPLOY_KEY }}
        run: just ci-test
