name: tmp-check

# 临时校验: 仅用于本轮改动验证, 验证通过后删除
on:
  push:
    tags: ["check-*"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check src/amane tests scripts
          uv run ruff format --check src/amane/handlers/purge.py src/amane/handlers/models.py \
            src/amane/handlers/__init__.py src/amane/api/models/tasks.py \
            src/amane/api/support/task_resolve.py src/amane/app/runtime.py \
            src/amane/app/bootstrap.py src/amane/db/models.py tests/handlers/test_purge.py

      - name: Tests (purge)
        run: uv run pytest tests/handlers/test_purge.py tests/handlers/test_cleanup.py -q

      - name: Tests (all)
        run: uv run pytest tests/ -q -p no:randomly
