name: tmp-check

# 临时校验工作流: 推 check-* 标签即校验, 用完删除 (含远端标签).
# 口径与先前一致: 依赖同步 / openapi 无漂移 / ruff lint / 前端检查与打包 / 全量 pytest.
# 不跑 typecheck-pyright: 分支既有的 tests/test_tenhow_source.py 等已有一批 stub 类型报错, 与本改动无关.
on:
  push:
    tags: ["check-*"]

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  static:
    name: lint + web + openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: sync deps
        run: just ci-sync

      - name: openapi drift / lint / web
        run: just _check-openapi lint check-web _web-bundle

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: just test
        env:
          FIXTURES_DEPLOY_KEY: ${{ secrets.FIXTURES_DEPLOY_KEY }}
        run: just test
