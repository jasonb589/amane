name: tmp-check

on:
  push:
    tags: ["check-*"]

jobs:
  check:
    name: caribbean + notify check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Sync
        run: just ci-sync

      - name: Ruff check
        run: uv run ruff check src/amane tests scripts

      - name: Tests
        run: |
          uv run pytest -q --tb=short \
            --deselect "tests/api/test_feeds.py::TestFeedsCrud::test_feed_item_batch_scrape_uses_feed_config" \
            --deselect "tests/api/test_schedules.py::TestSchedules::test_crud_and_trigger" \
            --deselect tests/agent/test_feed_ops.py::test_list_and_batch_feed_items \
            --deselect tests/agent/test_schedule_ops.py::test_create_update_and_trigger_schedule
