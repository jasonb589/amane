name: tmp-check

# 临时校验: 仅用于本轮改动验证, 验证通过后删除.
on:
  push:
    tags: ["check-*"]

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync deps
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check src/amane tests scripts
          uv run ruff format --check src/amane/config/manager.py tests/llm/test_prompts.py

      - name: Tests (all)
        run: uv run pytest tests/ -q -p no:randomly

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Web build (tsc + vite)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
