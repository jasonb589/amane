name: tmp-check

# 临时校验（Tenhow + Amazon 两个原生化海报源）。check-* 标签触发，跑完删除。
on:
  push:
    tags: ["check-*"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Ruff
        run: |
          uv run ruff check src tests --output-format=concise
          uv run ruff format --check src/amane/crawlers/sites/tenhow.py src/amane/crawlers/sites/amazon.py \
            tests/test_tenhow_source.py tests/test_amazon_source.py src/amane/enums.py

      - name: Pytest
        run: uv run pytest tests/test_tenhow_source.py tests/test_amazon_source.py tests/utils/test_utils.py -q

      - name: 注册冒烟
        run: |
          uv run python - <<'PY'
          from amane.crawlers import registry
          from amane.crawlers.site_roles import FILM_METADATA_SITES
          from amane.enums import SiteName
          for site in (SiteName.TENHOW, SiteName.AMAZON):
              assert site in FILM_METADATA_SITES, f"{site} 没进电影源清单"
              cls = registry.get(site)
              assert cls is not None, f"{site} 没注册"
              prof = cls.profile()
              print("ok:", prof.name, "| url:", prof.base_url, "| traits:", [t.value for t in prof.traits])
          PY

      - name: 线上抓一次 Amazon（只验证能解析出候选，允许失败）
        run: |
          uv run python - <<'PY' || true
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          from amane.crawlers.sites.amazon import _SEARCH_URL, _parse_results

          url = _SEARCH_URL.format(term=quote("Diabolus 鬼哭 下巻", safe=""))
          req = Request(url, headers={"Accept-Language": "ja-JP,ja;q=0.9", "User-Agent": "Mozilla/5.0"})
          try:
              with urlopen(req, timeout=30) as resp:  # noqa: S310
                  html = resp.read().decode("utf-8", "replace")
                  print("amazon http", resp.status, "candidates", len(_parse_results(html)))
          except Exception as exc:  # noqa: BLE001
              print("amazon probe skipped:", type(exc).__name__)
          PY
          PY
