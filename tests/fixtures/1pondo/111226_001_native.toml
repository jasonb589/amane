plot = "自然な笑顔が魅力の田中莉乃さん。スタッフからも思わず「本当に美人ですね！」と声が出るほど、華やかさと親しみやすさをあわせ持つ美女です。\nそんな莉乃さんに、セックスの体位について質問。「どんな体位が得意？」と聞かれると、迷わず返ってきた答えは「騎乗位！」。そのひと言をきっかけに、今回は騎乗位タイムトライアル企画へ挑戦することに！\n簡単なルール説明を受けた後、まずは本番に向けてしっかり準備。チンポを手で丁寧に刺激しながら、亀頭へ舌を這わせてじっくりと興奮を高めていきます。莉乃さんの巧みな攻めに反応し、みるみるうちに力強く反り立っていくチンポ。\nそして、いよいよ騎乗位でタイムトライアルスタート！\n時間内に射精させようと、最初はゆっくりとしたテンポで腰を動かしながら様子をうかがい、徐々にスピードアップ。上下だけでなく、前後左右へと動きに変化をつけながら、相手の反応を見て巧みに攻めていきます。\n得意と語るだけあって、腰使いは見応え十分。時間が進むにつれて動きにも力が入り、企画とはいえ莉乃さん自身もどんどん本気モードへ。果たして、このまま制限時間内に見事フィニッシュへ導くことができるのか!?\nそれとも、惜しくも時間切れとなり、恒例の罰ゲームを受けることになってしまうのか！？\n結果はぜひ本編で確かめてください！\n田中莉乃さんの自然な笑顔と美しさはもちろん、得意の騎乗位で見せる腰使い、時間制限ならではの緊張感、そして徐々に本気になっていく表情の変化まで楽しめる今作。何と言ってもプロポーションがヤバ過ぎです！"
